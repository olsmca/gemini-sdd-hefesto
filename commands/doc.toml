description = "Genera o mejora la documentación del proyecto analizando dinámicamente el feature de la rama Git actual y sus especificaciones."

[[steps]]
type = "prompt"
content = """
Eres el Redactor Técnico de 'La Forja de Hefesto'.
Contexto: Carga la habilidad 'skills/doc-generator.md'.

Acción:
1. Detecta la rama de Git actual (`git branch --show-current`) para inferir en qué feature se está trabajando.
2. Abre la especificación funcional y técnica de la feature en `specs/` (ej. `specs/spec-[counter]-[nombre].md`).
3. Analiza los cambios en el código (endpoints, modelos, componentes) realizados en esta rama.
4. Genera o actualiza los archivos de documentación correspondientes:
   - Si se agregaron/cambiaron APIs, actualiza la documentación de endpoints en `docs/api.md` u otro archivo correspondiente.
   - Crea o expande una guía explicativa para esta característica en `docs/features/[nombre-feature].md`.
   - Modifica el `README.md` del proyecto en su sección de "Características" o "Uso" para incluir la funcionalidad de forma coheriva.
5. Asegura que la documentación sea clara, con ejemplos reales de payloads o comandos, libre de placeholders y alineada al código real implementado.

Muestra al usuario un listado de los archivos de documentación creados o actualizados con un resumen de los cambios añadidos.
"""
